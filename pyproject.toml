[project]
name = "retschat"
version = "0.1.0"
description = "Chat interface for Danish law via the Retsinformation API"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.40.0",
    "openai>=1.50.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest",
    "pytest-asyncio",
]
